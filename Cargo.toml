[workspace]
resolver = "3"
members = ["bot", "common", "feed", "recapper"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
common = { path = "common" }
dotenvy = "0.15"
envy = "0.4"
futures = "0.3"
html2text = "0.15"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["brotli", "gzip", "json", "rustls"] }
# Rig is the agent harness; its minor versions break APIs, so updates stay within 0.45.
rig = "0.45"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["chrono", "postgres", "runtime-tokio"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[profile.release]
codegen-units = 1
lto = true
strip = true
