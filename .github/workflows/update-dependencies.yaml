name: Update Dependencies

on:
  schedule:
    # Runs on the 1st of every month at 06:00 UTC
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Update lockfile
        run: uv lock --upgrade

      - name: Update Pi-Bolt and web access
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh release view --repo opensec-git/Pi-Bolt --json tagName --jq .tagName)"
          web_access="$(curl -fsSL https://registry.npmjs.org/pi-web-access/latest | jq -r .version)"
          sed -i \
            -e "s/^ARG PIBOLT_VERSION=.*/ARG PIBOLT_VERSION=${tag#bolt-v}/" \
            -e "s/^ARG PI_WEB_ACCESS_VERSION=.*/ARG PI_WEB_ACCESS_VERSION=${web_access}/" \
            docker/recapper/Dockerfile

      - name: Check for updates
        id: check
        run: |
          if git diff --quiet uv.lock docker/recapper/Dockerfile; then
            echo "No dependency updates found."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify with pre-commit
        if: steps.check.outputs.has_changes == 'true'
        run: |
          uv sync --locked --group dev
          uv run pre-commit run --all-files

      - name: Commit and push changes
        if: steps.check.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add uv.lock docker/recapper/Dockerfile
          git commit -m "chore: update dependencies"
          git push
          gh workflow run ci.yaml --ref main
