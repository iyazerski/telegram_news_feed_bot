apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: telegram-news-tls
  labels:
    app.kubernetes.io/part-of: telegram_news_feed_bot
    app: telegram-news
spec:
  secretName: telegram-news-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - __PUBLIC_HOST__
