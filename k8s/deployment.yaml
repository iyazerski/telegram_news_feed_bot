apiVersion: apps/v1
kind: Deployment
metadata:
  name: telegram-news-bot
  labels:
    app.kubernetes.io/part-of: telegram_news_feed_bot
    app: telegram-news
    component: bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telegram-news
      component: bot
  template:
    metadata:
      labels:
        app: telegram-news
        component: bot
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: bot
          image: __BOT_IMAGE__
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          envFrom:
            - configMapRef:
                name: telegram-news-config
            - secretRef:
                name: telegram-news-database-secrets
            - secretRef:
                name: telegram-news-bot-secrets
          resources:
            requests:
              cpu: 15m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 10001
            runAsNonRoot: true
            runAsUser: 10001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telegram-news-feed
  labels:
    app.kubernetes.io/part-of: telegram_news_feed_bot
    app: telegram-news
    component: feed
spec:
  replicas: 1
  # Two feeds would read the same cursors and forward the same posts twice.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: telegram-news
      component: feed
  template:
    metadata:
      labels:
        app: telegram-news
        component: feed
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: feed
          image: __FEED_IMAGE__
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: telegram-news-config
            - secretRef:
                name: telegram-news-database-secrets
            - secretRef:
                name: telegram-news-bot-secrets
          # A first cycle over 80 posts with videos peaked at 43 MiB locally. The limit leaves room for one post's
          # media, which TELEGRAM_NEWS_POST_MEDIA_MAX_BYTES caps at 50 MB.
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 10001
            runAsNonRoot: true
            runAsUser: 10001
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: telegram-news-recapper-auth-pvc
  labels:
    app.kubernetes.io/part-of: telegram_news_feed_bot
    app: telegram-news
    component: recapper
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telegram-news-recapper
  labels:
    app.kubernetes.io/part-of: telegram_news_feed_bot
    app: telegram-news
    component: recapper
spec:
  replicas: 1
  # The sign-in volume is ReadWriteOnce, and two recappers could send the same recap twice.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: telegram-news
      component: recapper
  template:
    metadata:
      labels:
        app: telegram-news
        component: recapper
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: recapper
          image: __RECAPPER_IMAGE__
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: telegram-news-config
            - secretRef:
                name: telegram-news-database-secrets
            - secretRef:
                name: telegram-news-bot-secrets
            - secretRef:
                name: telegram-news-recapper-secrets
          volumeMounts:
            - name: chatgpt-auth
              mountPath: /var/lib/telegram-news/auth
          # A recap peaked at 14 MiB in a Linux container; the limit leaves room for long agent transcripts.
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 10001
            runAsNonRoot: true
            runAsUser: 10001
      volumes:
        - name: chatgpt-auth
          persistentVolumeClaim:
            claimName: telegram-news-recapper-auth-pvc
